[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grass-mcp"
version = "0.1.0"
description = "MCP server exposing GRASS session, project context, and tools"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
dependencies = ["mcp>=2.3.0,<2.4.0"]

[project.scripts]
grass-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "context"]

[tool.setuptools.packages.find]
where = ["."]
include = ["session*", "tools*"]
